<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClawAi3_Bot</title>
</head>
<body>
    <h1>ClawAi3_Bot'a Hoş Geldin</h1>
    <p id="status">Bot bağlantısı bekleniyor...</p>

    <script>
        // Basit domain kontrolü
        const allowedDomains = ['localhost', 'example.com', 'clawai35.github.io'];
        const currentDomain = window.location.hostname;

        if (allowedDomains.includes(currentDomain)) {
            document.getElementById('status').innerText = 'Bot başarıyla bağlandı!';
            // Buraya bot başlatma kodlarını ekleyebilirsin
        } else {
            document.getElementById('status').innerText = 'Geçersiz domain: ' + currentDomain;
        }
    </script>
</body>
</html>
